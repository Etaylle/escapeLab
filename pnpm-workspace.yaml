packages:
  - packages/*

# Prisma's engines are fetched by their own install scripts. The client is generated once per
# install, by the server's postinstall (packages/server/package.json): @prisma/client's script
# would generate it a second time, from the repo's root, so it is left out on purpose — listed
# as ignored, so that pnpm does not ask about it.
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
ignoredBuiltDependencies:
  - '@prisma/client'
