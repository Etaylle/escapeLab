name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run; main's runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # The store's tests in Postgres (packages/server/test/postgresSetup.ts) run against a throwaway
    # Postgres 16 beside the job: no password, reachable from the job alone, gone with it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Two real browsers play Blackout and the Systemcheck against the production
  # build (tools/shots.mjs); the screenshots and logs are kept for 14 days.
  walkthrough:
    needs: check
    runs-on: ubuntu-24.04
    # Setup takes 4 to 11 minutes by runner; Blackout runs 7 minutes locally and up to 12
    # on a slow runner since the opening and the gameplay captures, 2 more since the
    # reconnect drill (a crew of three, one away 80 s), 1 more since the restart drill,
    # 2 more since the three drill (a crew of three to the Signalkette, 75 s on a runner),
    # Systemcheck up to 8, 3 more since the Übungshalle's drill (189 s in CI) and 5 s since the
    # music drill (4.9 s in CI), its step now given 20 for three drills to come (below). Blackout's
    # new chain (18.11.2026: Anlaufsteuerung, Paketfilter, Wechselplatz) takes eleven captures
    # more and stands 12 s in the Serverraum after its solve: 15:05 in CI (2a9ce33), 14:27
    # locally at a load of 3 to 5 (863 s in its groups), a slow runner's third more 20:07. Its
    # step is given 20: setup (11 at most), 20 and 20 minutes of the two steps fit into the
    # job's 52.
    timeout-minutes: 52
    defaults:
      run:
        # Named, bash runs with -o pipefail: a walkthrough piped through tee
        # still fails its step when it exits non-zero.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      # Each walkthrough starts the production server itself and owns it (SHOTS_SERVER), with
      # ALLOW_SEED=1 — it pins its room to a seed (?seed=), so every run draws alike — and a
      # ROOM_SECRET of its own: its restart drill takes the server down and brings it back.
      # The server's log is server.log in each walkthrough's folder.
      - name: Walkthrough (Blackout)
        timeout-minutes: 20
        env:
          SHOTS_SERVER: packages/server/src/index.ts
        run: >-
          node tools/shots.mjs http://localhost:3001 shots-blackout 2>&1
          | tee shots-blackout.log
      - name: Walkthrough (Systemcheck)
        # Runs after a failed Blackout run too: both sets of screenshots are wanted. 6 minutes
        # on main's runner (14.11.2026), up to 8 on a slow one; the Übungshalle's drill, the
        # last before the run itself, adds 189 s in CI, 45.6 of them at the Zugangskontrolle
        # (14.11.2026: the step took 9:42 of its 14), and 269 s locally under a load of 30. Its
        # frames are sampled with 13 of 13 stations armed: the host's at 21,13 between two rows
        # of bays (137 frames, p95 16.8 ms, 8 of 17 beacons and 2 of 13 books in view), the
        # audience's on the whole hall (121 frames, p95 16.7 ms, 17 of 17 and 13 of 13). Three
        # drills come in on 17.11.2026: the Paketfilter's probe and its bay in the hall, about
        # 127 s (71.4 s and 55.1 s locally at a load of 4), the rotation's about 68 s and the
        # start-up station's about 45 s — 240 s on the 9:42 used, 13:42, against a slow runner's
        # third more: 18:16. The step is given 20.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SHOTS_MISSION: Systemcheck
          SHOTS_SERVER: packages/server/src/index.ts
        run: >-
          node tools/shots.mjs http://localhost:3001 shots-systemcheck 2>&1
          | tee shots-systemcheck.log
      - name: Keep screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough
          path: |
            shots-blackout/
            shots-systemcheck/
            shots-blackout.log
            shots-systemcheck.log
          retention-days: 14

  # Blackout's Wechselplatz has one of three stations a run. The walkthrough above plays the
  # Signalkette's seed with every capture; these two play the other draws to the won card with
  # one capture group each — the captures only that draw can take: the Notstromkasten's meter
  # on seed 93 (devices: meter-swing.png, device-phone-notstrom-b.png), the Funkpult's cabinet
  # on seed 56 (reading: book-morse-1.15.png, book-phone-landscape.png, book-phone-notepad.png).
  # 5:48 and 6:34 locally (18.11.2026, load 3 to 4); beside the walkthrough, not after it, so
  # the pipeline takes no longer. Each step is given 12, the job 25 with a setup of 11 at most.
  walkthrough-draws:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - draw: notstrom
            seed: 93
            only: devices
          - draw: frequenz
            seed: 56
            only: reading
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - name: Walkthrough (Blackout, ${{ matrix.draw }})
        timeout-minutes: 12
        env:
          SHOTS_SERVER: packages/server/src/index.ts
          SHOTS_SEED: ${{ matrix.seed }}
          SHOTS_ONLY: ${{ matrix.only }}
        run: >-
          node tools/shots.mjs http://localhost:3001 shots-blackout-${{ matrix.draw }} 2>&1
          | tee shots-blackout-${{ matrix.draw }}.log
      - name: Keep screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-${{ matrix.draw }}
          path: |
            shots-blackout-${{ matrix.draw }}/
            shots-blackout-${{ matrix.draw }}.log
          retention-days: 14
