name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run; main's runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # The store's tests in Postgres (packages/server/test/postgresSetup.ts) run against a throwaway
    # Postgres 16 beside the job: no password, reachable from the job alone, gone with it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Two real browsers play Blackout and the Systemcheck against the production
  # build (tools/shots.mjs); the screenshots and logs are kept for 14 days.
  walkthrough:
    needs: check
    runs-on: ubuntu-24.04
    # Setup takes 4 to 11 minutes by runner; Blackout runs 7 minutes locally and up to 12
    # on a slow runner since the opening and the gameplay captures, 2 more since the
    # reconnect drill (a crew of three, one away 80 s), 1 more since the restart drill,
    # 2 more since the three drill (a crew of three to the Signalkette, 75 s on a runner),
    # Systemcheck up to 8, 3 more since the Übungshalle's drill (182 s locally): setup, 19 and 14
    # minutes of the two steps fit into the job's 45.
    timeout-minutes: 45
    defaults:
      run:
        # Named, bash runs with -o pipefail: a walkthrough piped through tee
        # still fails its step when it exits non-zero.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      # Each walkthrough starts the production server itself and owns it (SHOTS_SERVER), with
      # ALLOW_SEED=1 — it pins its room to a seed (?seed=), so every run draws alike — and a
      # ROOM_SECRET of its own: its restart drill takes the server down and brings it back.
      # The server's log is server.log in each walkthrough's folder.
      - name: Walkthrough (Blackout)
        timeout-minutes: 19
        env:
          SHOTS_SERVER: packages/server/src/index.ts
        run: >-
          node tools/shots.mjs http://localhost:3001 shots-blackout 2>&1
          | tee shots-blackout.log
      - name: Walkthrough (Systemcheck)
        # Runs after a failed Blackout run too: both sets of screenshots are wanted. 6 minutes
        # on main's runner (14.11.2026), up to 8 on a slow one; the Übungshalle's drill, the
        # last before the run itself, adds 182 s locally (208 s in CI while its token device
        # turned every 30 s: the step took 9:34 then).
        if: ${{ !cancelled() }}
        timeout-minutes: 14
        env:
          SHOTS_MISSION: Systemcheck
          SHOTS_SERVER: packages/server/src/index.ts
        run: >-
          node tools/shots.mjs http://localhost:3001 shots-systemcheck 2>&1
          | tee shots-systemcheck.log
      - name: Keep screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough
          path: |
            shots-blackout/
            shots-systemcheck/
            shots-blackout.log
            shots-systemcheck.log
          retention-days: 14
